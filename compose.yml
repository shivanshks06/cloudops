services:
  nginx:
    image: nginx:alpine
    container_name: cloudops-nginx

    ports:
      - "8081:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - client
      - api
  client:
    build:
      context: ./client
      dockerfile: Dockerfile

    container_name: cloudops-client

    ports:
      - "5173:5173"

    environment:
      VITE_API_URL: http://localhost:5000

    depends_on:
      - api

  api:
    build:
      context: ./server
      dockerfile: Dockerfile

    container_name: cloudops-api

    ports:
      - "5000:5000"

    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/cloudops

    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine

    container_name: cloudops-db

    environment:
      POSTGRES_DB: cloudops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d cloudops" ]
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: cloudops-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - api

  node-exporter:
    image: prom/node-exporter
    container_name: cloudops-node-exporter
    ports:
      - "9100:9100"
    restart: unless-stopped
    networks:
      - default

  grafana:
    image: grafana/grafana
    container_name: cloudops-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ALLOW_EMBEDDING=true
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - default

  jenkins:
    build:
      context: ./jenkins
    container_name: cloudops-jenkins
    ports:
      - "8082:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - default

volumes:
  postgres_data:
  grafana_data:
  jenkins_home:
