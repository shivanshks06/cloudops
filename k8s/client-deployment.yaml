apiVersion: apps/v1
kind: Deployment

metadata:
  name: cloudops-client
  namespace: cloudops

spec:
  replicas: 2

  strategy:
    type: RollingUpdate

  selector:
    matchLabels:
      app: cloudops-client

  template:
    metadata:
      labels:
        app: cloudops-client

    spec:
      containers:
        - name: client

          image: shivanshks06/cloudops-client:latest

          imagePullPolicy: Always

          ports:
            - containerPort: 5173

          env:
            - name: VITE_API_URL
              value: /api

---
apiVersion: v1
kind: Service

metadata:
  name: cloudops-client-service
  namespace: cloudops

spec:
  selector:
    app: cloudops-client

  ports:
    - port: 80
      targetPort: 5173
