global:
  scrape_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

rule_files:
  - "/etc/prometheus/alerts.yml"

scrape_configs:
  - job_name: "cloudops-api"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "host.docker.internal:30090"

  - job_name: "node-exporter"
    static_configs:
      - targets:
          - "node-exporter:9100"